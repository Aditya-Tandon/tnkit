name: release-build

# Builds the sdist and wheel of a tagged version and checks them: the tag, pyproject.toml,
# CITATION.cff and the CHANGELOG heading must agree; twine check; the archive contents; and an
# install of the wheel in a clean venv that runs a small DMRG. The result is the `dist`
# artifact. Called by release-testpypi.yml and release-pypi.yml, which do the upload.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version, tag and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          c=$(sed -n 's/^version: *//p' CITATION.cff)
          echo "input $VERSION, pyproject $v, CITATION.cff $c, ref $GITHUB_REF"
          [ "$VERSION" = "$v" ] || { echo "::error::input $VERSION != pyproject $v"; exit 1; }
          [ "$c" = "$v" ] || { echo "::error::CITATION.cff $c != pyproject $v"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/v$v" ] || { echo "::error::run from tag v$v, not $GITHUB_REF"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::no CHANGELOG heading for $v"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          ls -l dist

      - name: Check the distributions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          twine check --strict dist/*
          python - <<'EOF'
          import os, tarfile, zipfile
          v = os.environ["VERSION"]
          whl, sdist = f"dist/tnkit-{v}-py3-none-any.whl", f"dist/tnkit-{v}.tar.gz"
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if not n.startswith(("tnkit/", f"tnkit-{v}.dist-info/"))]
          assert not bad, f"unexpected files in the wheel: {bad}"
          top = {n.split("/")[1] for n in tarfile.open(sdist).getnames() if n.count("/")}
          assert not top & {"tests", "bench", "docs", ".github"}, sorted(top)
          print(len(names), "files in the wheel; sdist top level:", sorted(top))
          EOF

      - name: Smoke test the wheel in a clean venv
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os, tnkit
          from tnkit import dmrg, tfim_mpo, tfim_ground_energy
          assert tnkit.__version__ == os.environ["VERSION"], tnkit.__version__
          assert "site-packages" in tnkit.__file__, tnkit.__file__
          E, _, _ = dmrg(tfim_mpo(10, g=1.0), chi=32, n_sweeps=10)
          err = abs(E - tfim_ground_energy(10, g=1.0))
          assert err < 1e-8, err
          print("tnkit", tnkit.__version__, "DMRG error", err)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
