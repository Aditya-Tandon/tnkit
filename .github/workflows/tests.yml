name: tests

# The test suite on Python 3.11 with the CPU build of torch, and the documentation build with
# warnings as errors, on non-draft pull requests (not on pushes). No GPU: tests that need a CUDA
# device skip themselves; run `pytest -m cuda` on a GPU machine before a release tag.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A fixed BLAS thread count keeps wall times steady and threaded reductions reproducible.
      OMP_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      NUMEXPR_NUM_THREADS: "3"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - name: Install
        # uv.lock, which must match pyproject.toml; the dev group and CPU-only torch (the
        # `torch` extra on Linux).
        run: |
          uv lock --check
          uv sync --frozen --extra torch
          uv pip check
      - name: Tests
        run: uv run --frozen pytest tests/ -q --durations=15

  docs:
    # The documentation build as Read the Docs runs it: warnings are errors.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group docs
      - name: Build
        run: uv run --frozen --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
