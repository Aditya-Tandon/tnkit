name: tests

# The test suite on Python 3.11 with the CPU build of torch, on non-draft pull requests to
# main only (not on pushes). No GPU: tests that need a CUDA device skip themselves; run
# `pytest -m cuda` on a GPU machine before a release tag.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A fixed BLAS thread count keeps wall times steady and threaded reductions reproducible.
      OMP_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      NUMEXPR_NUM_THREADS: "3"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "setuptools>=77" sympy      # test_packaging builds in-process; test_su2 checks against sympy
          pip install -e ".[test]"
          pip check
      - name: Tests
        run: python -m pytest tests/ -q --durations=15
